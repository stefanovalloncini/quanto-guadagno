<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calcola lo stipendio netto mensile e annuo a partire dalla RAL lorda, con le aliquote IRPEF e i contributi INPS in vigore dal 2024 al 2026."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fonts/Archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/ArchivoExpanded-600-latin.woff2" as="font" type="font/woff2" crossorigin>
    <title>Quanto Guadagno · Calcolo stipendio netto</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("qg.theme");
          var sys = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          var theme = stored === "light" || stored === "dark" ? stored : sys;
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
